<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Sarah AI — sua assistente de inteligência artificial"
    >

    <meta name="theme-color" content="#090a0f">

    <title>Sarah AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-logo">
                    S
                </div>

                <div class="brand-info">
                    <strong>Sarah AI</strong>
                    <span>Seu assistente de IA</span>
                </div>

            </div>

            <button
                class="sidebar-close"
                id="sidebar-close"
                type="button"
                aria-label="Fechar menu"
                onclick="toggleSidebar()"
            >
                ×
            </button>

        </div>


        <!-- Novo chat -->

        <div class="sidebar-content">

            <button
                class="new-chat-button"
                type="button"
                onclick="newChat()"
            >
                <span class="new-chat-icon">＋</span>
                <span>Novo chat</span>
            </button>


            <!-- Conversas -->

            <div class="conversation-section">

                <div class="section-title">
                    Conversas
                </div>

                <div id="conversation-list" class="conversation-list">

                    <button
                        class="conversation-item active"
                        type="button"
                        onclick="newChat()"
                    >

                        <span class="conversation-icon">
                            💬
                        </span>

                        <span class="conversation-name">
                            Nova conversa
                        </span>

                    </button>

                </div>

            </div>

        </div>


        <!-- Bottom sidebar -->

        <div class="sidebar-bottom">

            <div class="online-card">

                <span class="online-dot"></span>

                <div class="online-info">
                    <strong>Sarah está online</strong>
                    <small>IA disponível</small>
                </div>

            </div>


            <div class="sidebar-profile">

                <div class="profile-avatar">
                    S
                </div>

                <div class="profile-info">
                    <strong>Sarah AI</strong>
                    <span>Assistente pessoal</span>
                </div>

                <button
                    class="profile-more"
                    type="button"
                    aria-label="Mais opções"
                >
                    ⋮
                </button>

            </div>

        </div>

    </aside>


    <!-- Overlay mobile -->

    <div
        class="sidebar-overlay"
        id="sidebar-overlay"
        onclick="toggleSidebar()"
    ></div>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">


        <!-- Topbar -->

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="menu-button"
                    type="button"
                    aria-label="Abrir menu"
                    onclick="toggleSidebar()"
                >
                    ☰
                </button>

                <div class="mobile-brand">

                    <div class="mobile-logo">
                        S
                    </div>

                    <strong>Sarah AI</strong>

                </div>

            </div>


            <div class="topbar-right">

                <button
                    class="topbar-button"
                    type="button"
                    title="Nova conversa"
                    onclick="newChat()"
                >
                    ＋
                </button>

            </div>

        </header>


        <!-- =================================================
             CHAT
             ================================================= -->

        <section class="chat-area">

            <div
                id="messages"
                class="messages"
            >


                <!-- Welcome -->

                <div class="welcome">

                    <div class="welcome-logo">
                        S
                    </div>

                    <h1>
                        Olá, eu sou a
                        <span>Sarah.</span>
                    </h1>

                    <p>
                        Sua assistente de inteligência artificial.
                    </p>


                    <!-- Sugestões -->

                    <div class="suggestions">


                        <button
                            type="button"
                            onclick="useSuggestion('Explique-me um assunto de forma simples')"
                        >

                            <div class="suggestion-icon">
                                ✦
                            </div>

                            <div class="suggestion-content">

                                <strong>Aprender</strong>

                                <span>
                                    Explique um assunto para mim
                                </span>

                            </div>

                        </button>


                        <button
                            type="button"
                            onclick="useSuggestion('Ajude-me a criar uma ideia criativa')"
                        >

                            <div class="suggestion-icon">
                                ✨
                            </div>

                            <div class="suggestion-content">

                                <strong>Criar</strong>

                                <span>
                                    Ajude-me com uma ideia criativa
                                </span>

                            </div>

                        </button>


                        <button
                            type="button"
                            onclick="useSuggestion('Pesquise e explique este assunto para mim')"
                        >

                            <div class="suggestion-icon">
                                ◉
                            </div>

                            <div class="suggestion-content">

                                <strong>Explorar</strong>

                                <span>
                                    Descubra algo novo
                                </span>

                            </div>

                        </button>


                        <button
                            type="button"
                            onclick="useSuggestion('Ajude-me a resolver este problema')"
                        >

                            <div class="suggestion-icon">
                                ◇
                            </div>

                            <div class="suggestion-content">

                                <strong>Resolver</strong>

                                <span>
                                    Ajude-me com um problema
                                </span>

                            </div>

                        </button>


                    </div>

                </div>

            </div>


            <!-- =================================================
                 INPUT
                 ================================================= -->

            <div class="input-area">

                <form id="chat-form">

                    <div class="input-container">


                        <button
                            class="attach-button"
                            type="button"
                            title="Adicionar"
                            aria-label="Adicionar"
                        >
                            ＋
                        </button>


                        <textarea
                            id="message"
                            name="message"
                            rows="1"
                            placeholder="Como posso ajudar você?"
                            autocomplete="off"
                            spellcheck="true"
                            required
                        ></textarea>


                        <button
                            id="send-button"
                            class="send-button"
                            type="submit"
                            title="Enviar"
                            aria-label="Enviar mensagem"
                        >
                            ↑
                        </button>


                    </div>

                </form>


                <div class="input-footer">

                    <span>
                        A Sarah pode cometer erros. Verifique informações importantes.
                    </span>

                </div>

            </div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
